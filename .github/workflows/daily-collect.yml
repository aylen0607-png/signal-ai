name: Collect official AI videos
on:
  schedule:
    # GitHub Actions uses UTC; 02:00 UTC equals 10:00 in China Standard Time (UTC+8).
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      history:
        description: '补齐最近 365 天的 AI 相关视频（首次运行较慢）'
        required: false
        default: false
        type: boolean
permissions:
  contents: write

# Do not let a scheduled update and a manual historical scan push at the same time.
concurrency:
  group: ai-video-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/collect_youtube.py ${{ inputs.history == true && '--history' || '' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit refreshed feed
        run: |
          git config user.name "signal-ai-bot"
          git config user.email "signal-ai-bot@users.noreply.github.com"
          git add data/videos.json data/channel_cache.json
          if git diff --cached --quiet; then
            echo "No feed changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh daily video feed"
          git push || {
            echo "Remote changed during collection; rebasing once and retrying."
            git pull --rebase origin main
            git push
          }
