name: Collect official AI videos
on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/collect_youtube.py
      - name: Commit refreshed feed
        run: |
          git config user.name "signal-ai-bot"
          git config user.email "signal-ai-bot@users.noreply.github.com"
          git add data/videos.json data/channel_cache.json
          git diff --cached --quiet || git commit -m "chore: refresh daily video feed"
          git push
